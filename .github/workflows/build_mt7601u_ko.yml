name: Build mt7601u Kernel Module

on:
  push:
    branches:
      - R  # আপনার ব্রাঞ্চ নাম এখানে দিন, যেমন main বা অন্য

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ARCH: arm64
      CROSS_COMPILE: /tmp/ndk/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang-

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v3

      - name: Download Android NDK (r25b)
        run: |
          mkdir -p /tmp/ndk
          wget https://dl.google.com/android/repository/android-ndk-r25b-linux.zip -O ndk.zip
          unzip -q ndk.zip -d /tmp/ndk
          mv /tmp/ndk/android-ndk-r25b /tmp/ndk/ndk

      - name: Ensure kernel config
        run: |
          cd $GITHUB_WORKSPACE
          if [ ! -f .config ]; then
            make ARCH=${ARCH} defconfig
          fi

      - name: Prepare kernel build
        run: |
          cd $GITHUB_WORKSPACE
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} modules_prepare

      - name: Build mt7601u module
        run: |
          cd $GITHUB_WORKSPACE
          make ARCH=${ARCH} CROSS_COMPILE=${CROSS_COMPILE} M=drivers/net/wireless/mediatek/mt7601u modules

      - name: Upload built module
        uses: actions/upload-artifact@v4
        with:
          name: mt7601u.ko
          path: drivers/net/wireless/mediatek/mt7601u/*.ko
